name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.23.0
  NODE_VERSION: 24
  PYTHON_VERSION: "3.13"

jobs:
  javascript:
    name: Web lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Web lint
        run: corepack pnpm --filter @healthcare-manager/web lint
      - name: Web typecheck
        run: corepack pnpm --filter @healthcare-manager/web typecheck
      - name: Web tests
        run: corepack pnpm --filter @healthcare-manager/web test
      - name: Web build
        run: corepack pnpm --filter @healthcare-manager/web build

  api-quality:
    name: API quality and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked API environment
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
      - name: Unit tests
        run: uv run pytest -m 'not integration'

  api-postgres:
    name: API PostgreSQL 17 migration and full tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      HEALTHCARE_TEST_DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_test
      DATABASE_URL: postgresql+asyncpg://healthcare:healthcare@localhost:5432/healthcare_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked API environment
        run: uv sync --locked --extra dev
      - name: Apply migrations from an empty PostgreSQL 17 database
        run: uv run alembic upgrade head
      - name: Run every API test without integration skips
        run: uv run pytest

  worker-quality:
    name: Worker quality, poller, and PostgreSQL-backed test environment
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthcare_worker_test
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/worker
    env:
      HEALTHCARE_WORKER_DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_worker_test
      HEALTHCARE_TEST_DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_worker_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked worker environment
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
      - name: Check worker PostgreSQL connectivity
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          from healthcare_worker.outbox import PostgresOutboxStore

          async def main() -> None:
              store = await PostgresOutboxStore.from_dsn(os.environ["HEALTHCARE_WORKER_DATABASE_URL"])
              try:
                  assert await store.healthcheck()
              finally:
                  await store.close()

          asyncio.run(main())
          PY
      - name: Worker tests with PostgreSQL URL configured
        run: uv run pytest
